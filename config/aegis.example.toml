# AEGIS — exemple de configuration.
# Copiez ce fichier en `config/aegis.toml` puis adaptez-le.
# Une clé inconnue ou une valeur hors limites empêche le démarrage (rien n'est ignoré en silence).
#
# SECRETS : ils ne s'écrivent jamais ici.
#   - clé partagée moteur <-> MT5 : variable d'environnement AEGIS_SHARED_KEY
#     (à défaut, AEGIS crée data/shared.key, lisible uniquement par vous) ;
#   - jeton de l'API de contrôle : variable d'environnement AEGIS_API_TOKEN
#     (à défaut, AEGIS crée data/api.token) ; `aegisd pairing` l'affiche pour AEGIS Desktop.

[engine]
data_dir = "data"                # base de données, journaux, sauvegardes, clé
symbols = []                     # instruments autorisés ; vide = ceux envoyés par le connecteur MT5
signal_timeframes = ["M1", "M5"] # unités de temps des stratégies : M1, M5, M15, M30 ou H1
history_bars = 5000              # bougies demandées au terminal à la connexion (beaucoup d'historique = meilleur apprentissage)

[bridge]
listen = "127.0.0.1:7878"        # adresse où le connecteur MT5 se connecte (gardez-la locale ou privée)
max_skew_ms = 30000              # écart d'horloge toléré entre le PC MT5 et le moteur
peer_timeout_ms = 10000          # silence du terminal avant coupure
shared_key_env = "AEGIS_SHARED_KEY"

[api]
enabled = true                   # API de contrôle utilisée par AEGIS Desktop (locale ou distante)
listen = "127.0.0.1:7879"        # VPS : "0.0.0.0:7879" + pare-feu limité à votre adresse
token_env = "AEGIS_API_TOKEN"
tls = true                       # HTTPS, certificat auto-signé épinglé par le desktop (obligatoire hors boucle locale)
tls_names = []                   # adresses/nom du VPS à inscrire dans le certificat, ex. ["203.0.113.10"]

[risk]
# Valeurs INITIALES. Dès que vous modifiez les limites dans l'application,
# la version enregistrée en base prend le pas sur ce fichier.
risk_per_trade_pct = 0.5         # perte maximale par transaction, en % de l'équité
max_daily_loss_pct = 2.0         # perte nette du jour (réalisé + flottant) qui bloque les entrées
max_drawdown_pct = 10.0          # recul depuis le plus haut d'équité qui déclenche l'arrêt d'urgence
max_lots_per_trade = 0.0         # plafond de taille par transaction (lots) pour le micro-trading ; 0 = taille au risque seule
max_open_positions = 3
max_positions_per_symbol = 1
max_notional_leverage = 5.0      # exposition notionnelle totale / équité
max_spread_points = 25.0
max_slippage_points = 10.0       # au-delà, le connecteur refuse d'exécuter
min_net_expected_profit = 0.5    # espérance nette minimale par transaction (devise du compte) ; avec [brain], ~0.01
buy_min_probability = 0.75       # P(TP avant SL) minimale pour un ACHAT (0.50..0.99)
sell_min_probability = 0.75      # idem pour une VENTE ; jamais abaissée automatiquement
max_trades_per_day = 500         # entrées par jour (jusqu'à 10 000 ; 2 000 est une valeur valide)
max_consecutive_losses = 5       # pertes d'affilée avant une pause. 0 = désactivé
loss_cooldown_minutes = 30       # durée de la pause
max_orders_per_minute = 60       # débit maximal d'entrées (limites du broker)
max_currency_exposure = 5.0      # exposition notionnelle dans une même devise / équité
max_cost_to_gross_ratio = 0.6    # entrées bloquées si les coûts du jour dépassent 60 % des gains bruts
cost_check_min_trades = 20       # … vérifié à partir de 20 transactions clôturées
trading_windows = []             # plages UTC, ex. [{ start = "07:00", end = "20:00" }] ; vide = toujours
max_tick_age_ms = 5000
max_account_age_ms = 15000
authorization_ttl_ms = 3000      # durée de vie d'une autorisation d'ordre
commission_per_lot_round_turn = 7.0   # À ADAPTER À VOTRE BROKER (MT5 ne la fournit pas)
expected_slippage_points = 2.0
conversion_fee_pct = 0.0
expected_holding_nights = 0.0
kill_cancel_pending = true       # arrêt d'urgence : annuler les ordres en attente d'AEGIS
kill_position_policy = "keep"    # "keep" = conserver les positions avec leurs SL/TP ; "close" = les clôturer
# --- Risk Guardian 2.0 (0.3) : chaque réglage ne peut que REFUSER ou RÉDUIRE.
max_portfolio_risk_pct = 0.0     # pertes aux stops de toutes les positions + la nouvelle, en % ; 0 = positions max x risque par transaction
daily_risk_budget_pct = 0.0      # risque cumulé des entrées envoyées dans la journée, en % ; 0 = désactivé
allowed_weekdays = []            # jours UTC autorisés, ex. ["mon", "tue", "wed", "thu", "fri"] ; vide = tous
loss_streak_risk_scale = []      # multiplicateur de taille après N pertes d'affilée, ex. [1.0, 1.0, 0.75, 0.5] ; chaque valeur <= 1
allow_hedging = false            # positions opposées sur un même instrument : seulement sur un compte HEDGING
max_observed_slippage_points = 0.0  # refus si le slippage médian récent dépasse cette valeur ; 0 = désactivé
missing_stop_policy = "restore"  # position AEGIS sans SL chez le broker : "restore" | "close" | "alert"
missing_stop_grace_ms = 5000     # délai laissé au broker pour montrer le stop

[risk.stops]                     # Choix du stop initial (le volume est toujours recalculé sur la distance)
mode = "strategy"                # "strategy" (stop de la stratégie) | "adaptive" (structurel, sinon volatilité)
volatility_atr = 1.5
swing_strength = 3
swing_lookback = 60
structure_buffer_atr = 0.2
min_atr = 0.5
max_atr = 4.0
min_spreads = 3.0
keep_reward_ratio = true

[risk.daily_goal]                # Objectif de gain — un objectif, jamais une promesse
enabled = true
period = "day"                   # "day" (chaque jour, 0 h UTC) ou "month" (mois civil, UTC)
amount = 15.0                    # en devise du compte
basis = "net"                    # "net" (après commission, swap, frais) ou "gross" (brut)
policy = "stop_entries"          # "stop_entries" | "protect_gains" | "track_only"
protect_fraction = 0.8           # protect_gains : part du meilleur résultat à conserver

[market]
timeframes = ["M1", "M5", "M15", "M30", "H1"]   # H4 et D1 sont reconstruits depuis H1 (UTC)
series_capacity = 1500
stale_after_ms = 5000            # prix considéré obsolète
abnormal_spread_factor = 4.0     # spread anormal = x fois la médiane récente
max_clock_offset_ms = 120000

[execution]
magic = 20260115                 # doit être identique dans le connecteur MT5
result_timeout_ms = 5000
reconcile_grace_ms = 3000

[learning]
model_path = ""                  # ex. "models/model.json" ; vide = aucun modèle

[learning.gate]                  # critères qu'un modèle doit satisfaire pour filtrer les entrées
min_samples = 2000
min_folds = 4
min_auc_mean = 0.55
min_auc_each_fold = 0.5
min_brier_improvement = 0.002
max_ece = 0.05

[probability]                    # Probability Engine : P(TP avant SL), entraîné à la demande
tp_grid = [0.3, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0]   # cibles couvertes, en ATR
sl_grid = [0.5, 1.0, 1.5, 2.0, 3.0]                   # stops couverts, en ATR
horizon_bars = 60                # au-delà, un scénario non conclu compte comme un échec
stride = 2
folds = 5                        # walk-forward
ridge = 1.0
min_samples = 2000               # observations hors échantillon minimales
min_brier_skill = 0.001          # gain de Brier exigé du modèle complet sur la référence
max_ece = 0.05                   # erreur de calibration maximale
display_tp_atr = 0.5             # scénario affiché « P(BUY) / P(SELL) » sur le tableau de bord
display_sl_atr = 1.0

[brain]                          # Cerveau micro-profits : choisit la cible de chaque signal et apprend des transactions
enabled = false                  # true = le cerveau choisit les cibles de ses instruments ; false = cibles des stratégies
symbols = ["EURUSD"]             # variantes du broker comprises (EURUSDm, EURUSD.r...)
min_net_win = 0.08               # gain NET minimal si la cible est atteinte (après spread, commission, glissement)
max_net_win = 2.0                # gain NET maximal par transaction ; le volume est réduit si besoin, jamais augmenté
min_expected_net = 0.0           # espérance nette exigée (strictement au-dessus) ; le seuil de [risk] s'applique aussi
sl_pips = 0.0                    # Stop Loss en pips ; 0 = celui de la stratégie
tp_pips = 0.0                    # Take Profit FIXE en pips ; 0 = le cerveau le choisit dans la fourchette de gain
max_tp_pips = 0.0                # Take Profit maximum que le cerveau peut choisir, en pips ; 0 = sans limite
target_steps = 12                # cibles essayées par volume entre le gain minimal et maximal
min_tp_atr = 0.1                 # une cible plus proche que 0,1 ATR est du bruit : jamais utilisée
prior_trades = 20                # prudence de l'apprentissage : une leçon pèse n / (n + 20)
context_min_trades = 30          # transactions avant de pouvoir bloquer un contexte perdant
calibration_window = 200         # transactions récentes pour mesurer si les probabilités tiennent leurs promesses
retrain_every_hours = 24         # réentraînement automatique ; une meilleure version est PROPOSÉE, jamais activée seule
holdout_pct = 20.0               # part la plus récente de l'historique gardée pour comparer les versions
min_brier_gain = 0.0005          # gain exigé d'une nouvelle version sur la période de contrôle

[news]                           # News Intelligence (calendrier économique)
enabled = true
sources = [{ name = "faireconomy", url = "https://nfs.faireconomy.media/ff_calendar_thisweek.json" }]
refresh_minutes = 60
high_before_min = 30             # suspension autour d'une annonce à fort impact
high_after_min = 30
medium_before_min = 10           # prudence autour d'une annonce moyenne
medium_after_min = 10
caution_probability_margin = 0.05   # en prudence : probabilité exigée = seuil + 5 points
suspend_when_unavailable = false    # calendrier injoignable : true = suspendre, false = prudence

[shadow]                         # Shadow Intelligence (papier, champion / challenger)
enabled = true
variants = true                  # challengers : variantes TP/SL autour de chaque stratégie
forward_min_trades = 30
commission_per_lot_round_turn = 7.0   # remplacé par la valeur de la configuration de risque
missed_horizon_bars = 200

[ops]                            # fonctionnement sans surveillance (VPS)
heartbeat_file = true            # data/heartbeat mis à jour toutes les 10 s
backup_interval_hours = 24       # sauvegarde automatique ; 0 = désactivée
backup_keep = 14                 # sauvegardes automatiques conservées
alert_webhook_url = ""           # https://… recevant les alertes critiques en JSON (facultatif)
disconnect_alert_s = 60          # alerte si MT5 est déconnecté en mode automatique

[safety]
live_trading_enabled = false     # LIVE AUTO est impossible tant que ceci vaut false

[intelligence]                   # Régimes, multi-unités, scanner d'opportunités (voir docs/MARKET_INTELLIGENCE.md)
min_opportunity_score = 0        # entrée seulement si le scanner a une configuration de ce score ; 0 = désactivé
require_mtf_alignment = false    # refuser une entrée contredite par le contexte, la structure ou la confirmation
block_chaotic = true             # aucune entrée dans un marché désordonné
transition_probability_margin = 0.0  # en transition de tendance, probabilité exigée + marge (recommandé : 0.05)
keep = 200

[autonomy]                       # AEGIS AUTONOMY COMMANDER (voir docs/AUTONOMY.md)
default_profile = "research_autonomy"  # sans autorisation : "observer" (aucune recherche automatique) ou "research_autonomy"
live_default_hours = 8           # durée d'une autorisation LIVE donnée par set_mode (1..168 h)

[retention]
candle_days = 1095
snapshot_days = 180
