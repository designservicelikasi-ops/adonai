[package]
name = "aegisd"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "AEGIS headless engine (for a Linux VPS) and command-line tools"

[dependencies]
aegis-types.workspace = true
aegis-core.workspace = true
aegis-data.workspace = true
aegis-backtest.workspace = true
aegis-strategy.workspace = true
aegis-simterminal.workspace = true
aegis-learning.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
aegis-client.workspace = true
