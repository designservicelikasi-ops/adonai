<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/aegis-logo.svg" />
    <title>AEGIS</title>
    <style>
      html, body { margin: 0; background: #0A0E13; }
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        font-family: -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; color: #8C9BAB; transition: opacity .35s ease; z-index: 50; background: radial-gradient(1200px 600px at 50% 40%, #121922 0%, #0A0E13 70%); }
      #splash img { width: 96px; height: 96px; filter: drop-shadow(0 12px 32px rgba(201,162,39,.25)); }
      #splash .name { color: #E8EEF4; letter-spacing: .5em; font-weight: 600; font-size: 20px; padding-left: .5em; }
      #splash .sub { font-size: 12px; letter-spacing: .08em; }
      #splash .bar { width: 160px; height: 2px; background: #1C2734; overflow: hidden; border-radius: 2px; }
      #splash .bar i { display: block; width: 40%; height: 100%; background: linear-gradient(90deg, transparent, #C9A227, transparent); animation: s 1.1s ease-in-out infinite; }
      @keyframes s { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/aegis-logo.svg" alt="" />
      <div class="name">AEGIS</div>
      <div class="sub">Adaptive Engine for Intelligent Strategies</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
