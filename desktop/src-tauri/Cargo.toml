[package]
name = "aegis-desktop"
version = "0.3.0"
description = "AEGIS Desktop — supervision and control of the AEGIS engine"
authors = ["AEGIS"]
edition = "2021"

[workspace]

[lib]
name = "aegis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aegis-client = { path = "../../crates/aegis-client" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
