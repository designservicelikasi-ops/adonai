[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
aegis-types = { path = "crates/aegis-types" }
aegis-data = { path = "crates/aegis-data" }
aegis-risk = { path = "crates/aegis-risk" }
aegis-protocol = { path = "crates/aegis-protocol" }
aegis-market = { path = "crates/aegis-market" }
aegis-strategy = { path = "crates/aegis-strategy" }
aegis-backtest = { path = "crates/aegis-backtest" }
aegis-learning = { path = "crates/aegis-learning" }
aegis-execution = { path = "crates/aegis-execution" }
aegis-simterminal = { path = "crates/aegis-simterminal" }
aegis-core = { path = "crates/aegis-core" }
aegis-probability = { path = "crates/aegis-probability" }
aegis-news = { path = "crates/aegis-news" }
aegis-shadow = { path = "crates/aegis-shadow" }
aegis-client = { path = "crates/aegis-client" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
axum = { version = "0.7", default-features = false, features = ["http1", "json", "tokio"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
strip = true
